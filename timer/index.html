<!DOCTYPE html>
<html lang="en">
<head>

    <title>Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h2 class="day"></h2>
        <div class="time-container">
            <h2 class="hours">00 </h>

            <button class="stop">Stop</button>
            <button class="reset">Reset</button>
        </div>
    </main>
    <script src="app.js" type="module">

    </script>

</html>
